name: CI

on:
  push:
  pull_request:
  repository_dispatch:
    types: [run_build]
  workflow_dispatch: {}

jobs:
  ps2:
    runs-on: ubuntu-latest
    container: ps2dev/ps2sdk:latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup dependencies
      run: |
        apk update
        apk add build-base make git cmake

    - name: Compile OpenVCL and examples
      run: |
        cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$PS2DEV" -DBUILD_EXAMPLES=ON
        cmake --build build -j $(getconf _NPROCESSORS_ONLN)

    - name: Run OpenVCL tests
      run: |
        ctest --test-dir build --output-on-failure

    - name: Install OpenVCL
      run: |
        cmake --install build

    - name: Get short SHA
      id: slug
      run: echo "sha8=$(echo ${GITHUB_SHA} | cut -c1-8)" >> $GITHUB_OUTPUT

    - name: Upload artifacts
      if: ${{ success() }}
      uses: actions/upload-artifact@v4
      with:
        name: openvcl-${{ steps.slug.outputs.sha8 }}
        path: |
          openvcl
          examples/**/*.elf

  sanitizers:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    # -O1, as ASan's documentation suggests for speed: at -O0 the fixtures
    # below take several minutes to compile
    - name: Compile OpenVCL with ASan and UBSan
      run: |
        cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_EXAMPLES=OFF -DCMAKE_CXX_FLAGS="-O1 -fsanitize=address,undefined -fno-omit-frame-pointer"
        cmake --build build -j $(getconf _NPROCESSORS_ONLN)

    # Reports go to files, and any report fails the job: the integration tests
    # run openvcl as a child process, and a test that expects it to fail would
    # pass over a report on its stderr. openvcl does not free its register
    # allocation data before it exits, so leaks are not checked. No test
    # compiles the ps2gl programs in test/fixtures, so they are compiled here.
    - name: Run OpenVCL tests and compile the fixtures
      env:
        ASAN_OPTIONS: detect_leaks=0:log_path=${{ runner.temp }}/sanitizers/report
        UBSAN_OPTIONS: print_stacktrace=1:log_path=${{ runner.temp }}/sanitizers/report
      run: |
        mkdir -p "$RUNNER_TEMP/sanitizers"
        status=0
        ctest --test-dir build --output-on-failure || status=1
        for fixture in test/fixtures/*.vcl; do
          if ! ./openvcl -o "$RUNNER_TEMP/fixture.vsm" "$fixture"; then
            echo "openvcl failed on $fixture"
            status=1
          fi
        done
        for report in "$RUNNER_TEMP"/sanitizers/report.*; do
          if [ -f "$report" ]; then
            cat "$report"
            status=1
          fi
        done
        exit $status
